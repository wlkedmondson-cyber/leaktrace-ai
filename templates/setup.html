{% extends "base.html" %}
{% block content %}
<section class="auth-shell">
  <div class="panel auth-card">
    <div class="eyebrow">First Run Setup</div>
    <h1>Create Owner Account</h1>
    <p class="muted">This creates the first company and owner login. The first account starts on Business trial so you can test everything.</p>
    <form method="post">
      <label>Company Name <input name="company_name" required></label>
      <label>Your Name <input name="name" required></label>
      <label>Email <input name="email" type="email" required></label>
      <label>Password <input name="password" type="password" minlength="8" required></label>
      <button class="primary-btn" type="submit">Create Owner Login</button>
    </form>
  </div>
</section>
{% endblock %}
